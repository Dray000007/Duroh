<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Reset Password – DUROH</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="resetpassword.css">
  <link rel="stylesheet" href="notifications.css">
</head>
<body>
  <div id="notifications" aria-live="polite" aria-atomic="true"></div>
  <div class="bubbles"><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <div class="container">
    <div class="logo">DUROH</div>
    <div class="card">
      <h2 class="title">Reset Password</h2>
      <p class="subtitle">Enter a new password below</p>
      <p id="invalidMsg" style="display:none;color:#ff8080;text-align:center;margin-bottom:1rem">This link is invalid or expired. <a href="forgetpassword.html" style="color:#5795f3">Request a new one</a>.</p>
      <form id="resetForm" class="simple-form">
        <div class="form-group"><label>New Password</label><div class="input-wrapper"><input type="password" id="new-password" placeholder="Enter new password" required/><span id="toggleNew" class="toggle-password">👁</span></div></div>
        <div class="form-group"><label>Confirm Password</label><div class="input-wrapper"><input type="password" id="confirm-password" placeholder="Confirm new password" required/><span id="toggleConfirm" class="toggle-password">👁</span></div></div>
        <button type="submit" id="submitBtn">Reset Password</button>
      </form>
    </div>
  </div>
  <script type="module">
    import { account } from './appwrite.js';
    import { showNotification } from './notifications.js';
    document.addEventListener("DOMContentLoaded",()=>{
      const params=new URLSearchParams(window.location.search);
      const userId=params.get('userId'),secret=params.get('secret');
      const submitBtn=document.getElementById("submitBtn");
      if(!userId||!secret){document.getElementById("invalidMsg").style.display="block";document.getElementById("resetForm").style.display="none";}
      document.getElementById("toggleNew").addEventListener("click",()=>{const el=document.getElementById("new-password");el.type=el.type==="password"?"text":"password";document.getElementById("toggleNew").textContent=el.type==="password"?"👁":"🙈";});
      document.getElementById("toggleConfirm").addEventListener("click",()=>{const el=document.getElementById("confirm-password");el.type=el.type==="password"?"text":"password";document.getElementById("toggleConfirm").textContent=el.type==="password"?"👁":"🙈";});
      document.getElementById("resetForm").addEventListener("submit",async(e)=>{
        e.preventDefault();
        const newPwd=document.getElementById("new-password").value;
        const confirm=document.getElementById("confirm-password").value;
        if(newPwd!==confirm){showNotification("Passwords do not match!","error");return;}
        if(newPwd.length<8){showNotification("Password must be at least 8 characters.","error");return;}
        submitBtn.disabled=true;submitBtn.textContent="Resetting…";
        try{
          await account.updateRecovery(userId,secret,newPwd);
          showNotification("Password reset! Redirecting…","success");
          setTimeout(()=>window.location.href="index.html",1600);
        }catch(err){showNotification("Failed: "+(err.message||"Invalid or expired link."),"error");submitBtn.disabled=false;submitBtn.textContent="Reset Password";}
      });
    });
  </script>
</body>
</html>
