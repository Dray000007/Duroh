<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Upload – DUROH</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="upload.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
  <link rel="stylesheet" href="notifications.css">
</head>
<body>
  <div id="notifications" aria-live="polite" aria-atomic="true"></div>
  <header class="navbar">
    <div class="logo">DUROH</div>
    <nav>
      <ul class="nav-items">
        <li class="nav-item"><button class="nav-link" id="homeBtn"><span class="material-symbols-outlined">home</span> Home</button></li>
        <li class="nav-item"><button class="nav-link" id="inboxBtn"><span class="material-symbols-outlined">inbox</span> Inbox</button></li>
        <li class="nav-item"><button class="nav-link active"><span class="material-symbols-outlined">upload</span> Upload</button></li>
        <li class="nav-item"><button class="nav-link" id="profileBtn"><span class="material-symbols-outlined">person</span> Profile</button></li>
      </ul>
    </nav>
    <button class="menu-toggle" id="menuToggle"><span class="material-symbols-outlined">menu</span></button>
    <nav class="mobile-nav" id="mobileNav" aria-hidden="true">
      <ul>
        <li><button class="nav-link" onclick="window.location.href='index.html'">Home</button></li>
        <li><button class="nav-link" onclick="window.location.href='chat.html'">Inbox</button></li>
        <li><button class="nav-link" onclick="window.location.href='upload.html'">Upload</button></li>
        <li><button class="nav-link" onclick="window.location.href='profile.html'">Profile</button></li>
      </ul>
    </nav>
  </header>
  <div class="cont">
    <form id="uploadForm">
      <div class="weq"><span class="material-symbols-outlined">upload_2</span><h1>Upload Video</h1></div>
      <input type="file" id="videoFile" accept="video/*" required hidden />
      <label for="videoFile" class="custom-upload">Choose Video</label>
      <textarea name="caption" id="caption" placeholder="Enter your caption"></textarea>
      <div class="preview"></div>
      <button type="submit" id="submit">Upload<div class="loader" id="loader"></div></button>
    </form>
  </div>
  <script type="module">
    import { account, databases, requireAuth, ID, DB_ID, COL_VIDEOS } from './appwrite.js';
    import { showNotification } from './notifications.js';
    document.getElementById('homeBtn').onclick    = () => window.location.href='index.html';
    document.getElementById('inboxBtn').onclick   = () => window.location.href='chat.html';
    document.getElementById('profileBtn').onclick = () => window.location.href='profile.html';
    const menuToggle=document.getElementById('menuToggle');
    const mobileNav=document.getElementById('mobileNav');
    const closeNav=()=>{mobileNav.style.display='none';mobileNav.setAttribute('aria-hidden','true')};
    const openNav=()=>{mobileNav.style.display='block';mobileNav.setAttribute('aria-hidden','false')};
    menuToggle.addEventListener('click',e=>{e.stopPropagation();mobileNav.style.display==='block'?closeNav():openNav()});
    document.addEventListener('click',e=>{if(!mobileNav.contains(e.target)&&e.target!==menuToggle)closeNav()});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNav()});

    const currentUser = await requireAuth('index.html');
    if (!currentUser) throw new Error('Not authenticated');

    const videoFileInput=document.getElementById('videoFile');
    const previewContainer=document.querySelector('.preview');
    const uploadForm=document.getElementById('uploadForm');
    const captionInput=document.getElementById('caption');
    const submitBtn=document.getElementById('submit');
    const loader=document.getElementById('loader');

    videoFileInput.addEventListener('change',()=>{
      const file=videoFileInput.files[0];
      if(!file)return;
      previewContainer.innerHTML=`<video src="${URL.createObjectURL(file)}" controls autoplay loop muted></video>`;
    });

    uploadForm.addEventListener('submit',async(e)=>{
      e.preventDefault();
      const file=videoFileInput.files[0];
      const caption=captionInput.value.trim();
      if(!file){showNotification('Select a video!','error');return;}
      if(!caption){showNotification('Enter a caption!','error');return;}
      loader.style.display='inline-block';submitBtn.disabled=true;
      try{
        // Upload video to Cloudinary
        const formData=new FormData();
        formData.append('file',file);
        formData.append('upload_preset','saveImages');
        const res=await fetch('https://api.cloudinary.com/v1_1/djjlt3ghq/video/upload',{method:'POST',body:formData});
        const data=await res.json();
        if(!data.secure_url) throw new Error('Cloudinary upload failed: '+(data.error?.message||'unknown'));
        // Save metadata to Appwrite
        await databases.createDocument(DB_ID,COL_VIDEOS,ID.unique(),{
          url:data.secure_url,
          caption,
          user_id:currentUser.$id,
          created_at:new Date().toISOString(),
        });
        previewContainer.innerHTML='';
        captionInput.value='';
        videoFileInput.value='';
        showNotification('Upload Successful! 🎉','success');
      }catch(err){
        console.error(err);
        showNotification('Upload failed: '+(err.message||'Unknown error'),'error');
      }finally{loader.style.display='none';submitBtn.disabled=false;}
    });
  </script>
</body>
</html>
