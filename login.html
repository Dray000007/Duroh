<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – DUROH</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="notifications.css">
</head>
<body>
  <div id="notifications" aria-live="polite" aria-atomic="true"></div>
  <div class="login-container">
    <div class="logo">DUROH</div>
    <div class="background-animation" id="background-animation"></div>
    <div class="login-card">
      <div class="header-content"><h2>Welcome Back</h2><p>Log in to continue</p></div>
      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <div class="input-wrapper">
            <input id="email" type="email" required placeholder="Enter your email" />
          </div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input id="password" type="password" required placeholder="Enter your password" />
            <span id="togglePassword" class="toggle-password">👁</span>
          </div>
        </div>
        <div class="form-group remember">
          <label for="rememberMe">
            <input type="checkbox" id="rememberMe" /> Remember me
          </label>
        </div>
        <button type="submit" id="login-button" class="login-button">
          <span class="button-text">Log in</span>
          <span class="spinner hidden"></span>
        </button>

        <!-- Google login -->
        <button type="button" id="google-login-button" class="google-login-button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-right:10px;flex-shrink:0">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>

        <div class="label-group">
          <button type="button" id="forgot-password">Forgot Password?</button>
        </div>
      </form>
      <div class="signup-prompt"><button id="yeah">Don't have an account? Sign up</button></div>
      <div class="footer-text">© 2025 DUROH. All rights reserved.</div>
    </div>
  </div>

  <script type="module">
    import { account, getCurrentUser } from './appwrite.js';
    import { showNotification } from './notifications.js';

    // Already logged in → go straight to home
    getCurrentUser().then(u => { if (u) window.location.replace('index.html'); });

    document.addEventListener("DOMContentLoaded", () => {
      const bg = document.getElementById('background-animation');
      for (let i = 0; i < 20; i++) {
        const b = document.createElement('div');
        b.className = 'bubble';
        const s = Math.random() * 100 + 50;
        b.style.cssText = `width:${s}px;height:${s}px;left:${Math.random() * 100}%;top:${Math.random() * 100}%;animation-duration:${Math.random() * 10 + 10}s;animation-delay:${Math.random() * 5}s`;
        bg.appendChild(b);
      }

      const loginForm = document.getElementById("login-form");
      const loginBtn  = document.getElementById("login-button");
      const btnText   = loginBtn.querySelector(".button-text");
      const spinner   = loginBtn.querySelector(".spinner");
      const pwdInput  = document.getElementById("password");
      const toggle    = document.getElementById("togglePassword");
      const remember  = document.getElementById("rememberMe");

      const saved = localStorage.getItem('remember_email');
      if (saved) { document.getElementById('email').value = saved; remember.checked = true; }

      toggle.addEventListener("click", () => {
        pwdInput.type = pwdInput.type === "password" ? "text" : "password";
        toggle.textContent = pwdInput.type === "password" ? "👁" : "🙈";
      });

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email    = document.getElementById("email").value.trim();
        const password = pwdInput.value;
        btnText.classList.add("hidden"); spinner.classList.remove("hidden"); loginBtn.disabled = true;
        try {
          await account.createEmailPasswordSession(email, password);
          if (remember.checked) localStorage.setItem('remember_email', email);
          else localStorage.removeItem('remember_email');
          window.location.href = "index.html";
        } catch {
          showNotification("Invalid email or password.", 'error');
        } finally {
          btnText.classList.remove("hidden"); spinner.classList.add("hidden"); loginBtn.disabled = false;
        }
      });

      // Google OAuth
      document.getElementById("google-login-button").addEventListener("click", () => {
        account.createOAuth2Session(
          'google',
          window.location.origin + '/index.html',
          window.location.origin + '/login.html'
        );
      });

      document.getElementById("forgot-password").addEventListener("click", () => window.location.href = "forgetpassword.html");
      document.getElementById("yeah").addEventListener("click", () => window.location.href = "signup.html");
    });
  </script>
</body>
</html>
