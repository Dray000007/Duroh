<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Forgot Password – DUROH</title>
  <link rel="stylesheet" href="forgetpassword.css">
  <link rel="stylesheet" href="notifications.css">
</head>
<body>
  <div id="notifications" aria-live="polite" aria-atomic="true"></div>
  <div class="login-container">
    <div class="logo">DUROH</div>
    <div class="login-card">
      <h2>Forgot Password</h2>
      <p>Enter your registered email to receive a reset link.</p>
      <form id="forgotForm">
        <input type="email" id="resetEmail" placeholder="Enter your email" required />
        <button type="submit" id="sendBtn" class="send-button">Send link</button>
      </form>
      <button id="vf">Back to log in</button>
      <div class="footer-text">© 2025 DUROH. All rights reserved.</div>
    </div>
  </div>
  <script type="module">
    import { account } from './appwrite.js';
    import { showNotification } from './notifications.js';
    document.addEventListener("DOMContentLoaded",()=>{
      const form=document.getElementById("forgotForm");
      const sendBtn=document.getElementById("sendBtn");
      form.addEventListener("submit",async(e)=>{
        e.preventDefault();
        const email=document.getElementById("resetEmail").value.trim();
        if(!email){showNotification("Please enter your email.","error");return;}
        const resetUrl=window.location.origin+window.location.pathname.substring(0,window.location.pathname.lastIndexOf('/'))+"/resetpassword.html";
        sendBtn.disabled=true;sendBtn.textContent="Sending…";
        try{
          await account.createRecovery(email,resetUrl);
          showNotification("Reset link sent — check your inbox.","success");
          document.getElementById("resetEmail").value="";
        }catch(err){showNotification(err.message||"Failed to send reset email.","error");}
        finally{sendBtn.disabled=false;sendBtn.textContent="Send link";}
      });
      document.getElementById("vf").addEventListener("click",()=>window.location.href="index.html");
    });
  </script>
</body>
</html>
